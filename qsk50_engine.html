<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>QSK50 — Параметры ДВС</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<style>
:root{
  --bg:#0f1923;--bg2:#1a2535;--bg3:#1e2d3d;--card:#243040;
  --brd:rgba(100,160,220,0.12);--brd2:rgba(100,160,220,0.22);
  --tx:#d4e4f7;--tx2:#8aaccc;--tx3:#4d6a87;
  --acc:#00d4aa;--red:#ff4d6a;--amb:#ffc542;--grn:#3ddc84;
  --blu:#5b8fff;--pur:#b06bff;--cyan:#00bfff;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:13px;display:flex;flex-direction:column;height:100vh;overflow:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 80% 60% at 50% 0%,rgba(0,212,170,0.04),transparent);pointer-events:none;z-index:0}

/* ── TOPBAR ── */
.tb{display:flex;align-items:center;gap:12px;padding:0 18px;height:48px;border-bottom:1px solid var(--brd);background:rgba(10,18,28,0.97);backdrop-filter:blur(16px);position:relative;z-index:100;flex-shrink:0}
.logo{font-weight:800;font-size:14px;color:var(--acc);letter-spacing:-.3px}
.logo span{color:var(--tx3);font-weight:400;font-size:10px;margin-left:6px}
.sep{width:1px;height:24px;background:var(--brd2);flex-shrink:0}
.kpis{display:flex;gap:20px;margin-left:auto;align-items:center}
.kpi{text-align:right}
.kpi .v{font-size:15px;font-weight:700;font-family:'SF Mono',monospace;color:var(--acc)}
.kpi .l{font-size:9px;color:var(--tx3);text-transform:uppercase;letter-spacing:.6px}

/* ── LOAD BAR ── */
.loadbar{display:flex;align-items:center;gap:10px;padding:8px 18px;border-bottom:1px solid var(--brd);background:var(--bg2);flex-shrink:0;flex-wrap:wrap;position:relative;z-index:90}
.lb-title{font-size:10px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.7px;white-space:nowrap}
.drop-zone{display:flex;align-items:center;gap:8px;padding:7px 14px;border:1px dashed var(--brd2);border-radius:8px;cursor:pointer;transition:all .15s;position:relative;min-width:240px}
.drop-zone:hover,.drop-zone.drag{border-color:var(--acc);background:rgba(0,212,170,0.06);border-style:solid}
.drop-zone.has-files{border-color:var(--grn);border-style:solid;background:rgba(61,220,132,0.05)}
.drop-zone input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.dz-icon{font-size:16px}
.dz-text{font-size:11px;color:var(--tx2);line-height:1.3}
.dz-count{font-size:10px;font-weight:700;color:var(--grn)}
.status{font-size:10px;color:var(--tx3);margin-left:auto}
.status.ok{color:var(--grn)}
.status.err{color:var(--red)}

/* ── TRUCK PILLS ── */
.truck-row{display:flex;align-items:center;gap:6px;padding:6px 18px;border-bottom:1px solid var(--brd);background:var(--bg);flex-shrink:0;flex-wrap:wrap;position:relative;z-index:89;min-height:38px}
.truck-pill{display:flex;align-items:center;gap:5px;padding:4px 10px;border:1px solid var(--brd2);border-radius:20px;font-size:11px;color:var(--tx2);cursor:pointer;transition:all .15s;user-select:none}
.truck-pill:hover{border-color:var(--acc);color:var(--acc)}
.truck-pill.active{background:rgba(0,212,170,0.12);border-color:var(--acc);color:var(--acc);font-weight:600}
.truck-pill .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.tr-label{font-size:10px;color:var(--tx3);margin-right:4px}
.compare-btn{padding:4px 12px;border:1px solid var(--brd2);border-radius:6px;font-size:10px;font-weight:600;color:var(--tx3);background:none;cursor:pointer;transition:all .15s;margin-left:auto}
.compare-btn:hover,.compare-btn.act{border-color:var(--pur);color:var(--pur);background:rgba(176,107,255,0.1)}

/* ── TABS ── */
.tabs{display:flex;border-bottom:1px solid var(--brd);background:var(--bg2);position:relative;z-index:88;flex-shrink:0;overflow-x:auto}
.tabs::-webkit-scrollbar{height:3px}
.tabs::-webkit-scrollbar-thumb{background:var(--brd2);border-radius:2px}
.tbtn{padding:9px 14px;border:none;border-bottom:2px solid transparent;background:none;color:var(--tx3);cursor:pointer;font-size:11px;font-weight:500;white-space:nowrap;transition:all .12s}
.tbtn:hover{color:var(--tx);background:rgba(255,255,255,0.03)}
.tbtn.act{color:var(--acc);border-bottom-color:var(--acc);background:rgba(0,212,170,0.05)}

/* ── CONTENT ── */
.content{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;z-index:1}
.content::-webkit-scrollbar{width:6px}
.content::-webkit-scrollbar-thumb{background:var(--brd2);border-radius:3px}
.panel{display:none;padding:14px;gap:14px}
.panel.show{display:flex;flex-direction:column}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.row-full{width:100%}
.card{background:var(--card);border:1px solid var(--brd);border-radius:10px;padding:10px;overflow:hidden}

/* ── ZONE LEGEND ── */
.legend-row{display:flex;gap:14px;flex-wrap:wrap;padding:0 0 8px}
.leg{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--tx3)}
.leg-box{width:12px;height:8px;border-radius:2px;flex-shrink:0}

/* ── EMPTY STATE ── */
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;padding:60px 20px;color:var(--tx3);text-align:center}
.empty-state .icon{font-size:52px;opacity:.25}
.empty-state h3{font-size:15px;color:var(--tx2);font-weight:600}
.empty-state p{font-size:12px;line-height:1.7;max-width:400px}
.empty-state .hint{font-size:11px;color:var(--acc);background:rgba(0,212,170,0.08);
  padding:8px 14px;border-radius:6px;border:1px solid rgba(0,212,170,0.2)}
</style>
</head>
<body>

<!-- ── TOPBAR ── -->
<div class="tb">
  <div class="logo">⚙ QSK50 <span>Cummins MCRS · NTE200 / KOMATSU 730E</span></div>
  <div class="sep"></div>
  <div class="kpis">
    <div class="kpi"><div class="v" id="kpi-trucks">0</div><div class="l">Самосвалов</div></div>

  </div>
</div>

<!-- ── LOAD BAR ── -->
<div class="loadbar">
  <div class="lb-title">📂 Файлы</div>
  <div class="drop-zone" id="dz" ondragover="dzOver(event)" ondragleave="dzLeave()" ondrop="dzDrop(event)">

    <div>
      <div class="dz-text">INSITE Log Files CSV</div>

<script>
'use strict';
// ═══════════════════════════════════════════════════
// PALETTE & PLOTLY CONFIG
// ═══════════════════════════════════════════════════
const C={bg:'#0f1923',bg2:'#1a2535',card:'#243040',acc:'#00d4aa',red:'#ff4d6a',amb:'#ffc542',grn:'#3ddc84',blu:'#5b8fff',pur:'#b06bff',cyan:'#00bfff',tx:'#d4e4f7',tx3:'#4d6a87'};
const TRUCK_COLORS=[C.acc,C.blu,C.amb,C.red,C.pur,C.cyan,C.grn,'#ff8c42','#ff6eb4','#a3e635'];
const PLY_BASE={paper_bgcolor:C.card,plot_bgcolor:'rgba(20,30,45,0.6)',font:{color:C.tx,family:'Segoe UI,sans-serif'},margin:{l:48,r:12,t:36,b:40},xaxis:{gridcolor:'rgba(100,160,220,0.07)',zerolinecolor:'rgba(100,160,220,0.12)',color:C.tx3},yaxis:{gridcolor:'rgba(100,160,220,0.07)',zerolinecolor:'rgba(100,160,220,0.12)',color:C.tx3},legend:{bgcolor:'rgba(0,0,0,0)',borderwidth:0,font:{size:10}}};
const PLY_CFG={responsive:true,displaylogo:false,modeBarButtonsToRemove:['select2d','lasso2d','autoScale2d'],toImageButtonOptions:{format:'png',scale:2}};

function pl(id,data,lay={},cfg={}){
  const L=Object.assign({},PLY_BASE,lay);
  if(lay.xaxis)L.xaxis=Object.assign({},PLY_BASE.xaxis,lay.xaxis);
  if(lay.yaxis)L.yaxis=Object.assign({},PLY_BASE.yaxis,lay.yaxis);
  if(lay.yaxis2)L.yaxis2=Object.assign({showgrid:false,color:C.tx3},lay.yaxis2);
  Plotly.react(id,data,L,Object.assign({},PLY_CFG,cfg));
}
function empty(id,msg='Нет данных'){
  pl(id,[],{title:{text:msg,font:{color:C.tx3,size:11}},height:160,annotations:[{text:'← Загрузите CSV файлы',showarrow:false,font:{color:C.tx3,size:12}}]});
}

// ═══════════════════════════════════════════════════
// DATA STORE
// ═══════════════════════════════════════════════════
const DB={};        // key → {rows, cols, truck, model, file}
let activeTruck=null;
let compareMode=false;
const truckOrder=[];

// ═══════════════════════════════════════════════════
// COLUMN DETECTION  (partial-match on col names)
// ═══════════════════════════════════════════════════
// Returns first column name that matches all include terms and no exclude terms
function findCol(cols,...terms){
  const inc=terms.filter(t=>typeof t==='string');
  return cols.find(c=>inc.every(t=>c.includes(t)))||null;
}
// Returns all matching columns
function findCols(cols,...terms){
  return cols.filter(c=>terms.every(t=>c.includes(t)));
}

// Specific finders
function colRPM(cols){return findCol(cols,'об/мин','двигателя')||findCol(cols,'Engine Speed (RPM)');}
function colTCool(cols){
  // "Датчик температуры (°C)- Идентификатор0"  — no qualifier = coolant
  const c=cols.find(c=>/^Датчик температуры \(°C\)/.test(c))||findCol(cols,'Engine Coolant Temperature');
  return c||null;
}
function colTOil(cols){return findCol(cols,'Температура масла (°C)')||findCol(cols,'Engine Oil Temperature');}
function colPOil(cols){return findCol(cols,'Давление масла (кПа)')||findCol(cols,'Engine Oil Pressure (kPa)');}
function colCrank(cols){return findCol(cols,'Давление картерных газов')||findCol(cols,'Crankcase Pressure');}
function colBoost(cols){return findCol(cols,'Давление во впускном коллекторе (кПа)- Идентификатор0')||findCol(cols,'Intake Manifold Pressure (kPa)');}
function colFuel(cols){return findCol(cols,'Мгновенный расход топлива (л/час)- Идентификатор0')||findCol(cols,'Instantaneous Fuel Rate');}
function colLoad(cols){return findCol(cols,'Относительная нагрузка (Проценты)- Идентификатор0')||findCol(cols,'Percent Load');}
function colBatt(cols){return findCol(cols,'Напряжение аккумуляторной батареи (В)- Идентификатор0')||findCol(cols,'Battery Voltage (V)- Identifier0');}
function colTexhAvg(cols){return findCol(cols,'Средняя температура отработавших газов (расчетное значение)')||findCol(cols,'Average Exhaust Temperature (Calculated)');}
function colTexhL(cols){return findCol(cols,'левый ряд')||findCol(cols,'Left Bank');}
function colTexhR(cols){return findCol(cols,'правый ряд')||findCol(cols,'Right Bank');}
function colTIntake(cols){return findCol(cols,'Температура воздуха во впускном коллекторе (°C)')||findCol(cols,'Intake Manifold Air Temperature');}
function colFRailCmd(cols){return findCol(cols,'Заданное давление в общем топливопроводе','Идентификатор0')||findCol(cols,'Fuel Rail Pressure Commanded');}
function colFRailMeas(cols){return findCol(cols,'Измеренное давление в общем топливопроводе','Идентификатор0')||findCol(cols,'Fuel Rail Pressure Measured');}
function colPreFilterOil(cols){return findCol(cols,'Давление в предварительном масляном фильтре')||findCol(cols,'pre-filter');}
function colOilFilterDelta(cols){return findCol(cols,'перепад давления в масляном фильтре')||findCol(cols,'oil filter delta');}
function colAccel(cols){return findCol(cols,'Процент действия педали или рычага акселератора')||findCol(cols,'Accel Pedal');}
function colFan(cols){return findCol(cols,'Команда управления вентилятором')||findCol(cols,'Fan Command');}
function colFuelPumpDuty(cols){return findCol(cols,'Рабочий цикл привода топливного насоса (Проценты)- Идентификатор0')||findCol(cols,'Fuel Pump Drive Duty Cycle');}
function colFuelPumpCurrent(cols){return findCol(cols,'Заданный ток привода топливного насоса (мА)- Идентификатор0')||findCol(cols,'Fuel Pump Drive Current Commanded');}

// All 16 cylinder exhaust temps in order 1..16
function colsCyls(cols){
  const res=[];
  for(let n=1;n<=16;n++){
    const c=cols.find(c=>c.includes('отработавших газов цилиндра '+n+' (°C)')||c.includes('Cyl '+n+' Exhaust')||c.includes('Cyl'+n+' Exhaust'));
    if(c)res.push({n,col:c});
  }
  return res;
}

// Intake manifold temps 1-4
function colsManifold(cols){
  const res=[];
  for(let n=1;n<=4;n++){
    const c=findCol(cols,'впускного коллектора '+n+' (°C)')||findCol(cols,'Intake Manifold '+n);
    if(c)res.push({n,col:c});
  }
  return res;
}

// ═══════════════════════════════════════════════════
// MATH UTILS
// ═══════════════════════════════════════════════════
function toNum(v){if(typeof v==='number')return isNaN(v)?null:v;const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?null:n;}
function getCol(rows,col){return rows.map(r=>toNum(r[col]));}
function nn(arr){return arr.filter(v=>v!==null&&!isNaN(v));}
function mean(a){const b=nn(a);return b.length?b.reduce((s,v)=>s+v,0)/b.length:null;}
function std(a){const m=mean(a),b=nn(a);if(!b.length||m===null)return 0;return Math.sqrt(b.map(v=>(v-m)**2).reduce((s,v)=>s+v,0)/b.length);}
function med(a){const b=nn(a).sort((x,y)=>x-y);return b.length?b[Math.floor(b.length/2)]:null;}
function pct(a,p){const b=nn(a).sort((x,y)=>x-y);return b.length?b[Math.floor(p/100*b.length)]:null;}
function ewma(arr,alpha=0.08){const out=[];let s=null;for(const v of arr){if(v!==null){s=s===null?v:alpha*v+(1-alpha)*s;out.push(+s.toFixed(2));}else out.push(s);}return out;}
function rollMean(arr,w=60){return arr.map((_,i)=>{const sl=arr.slice(Math.max(0,i-w+1),i+1).filter(v=>v!==null);return sl.length?mean(sl):null;});}
function rollStd(arr,w=60){return arr.map((_,i)=>{const sl=arr.slice(Math.max(0,i-w+1),i+1).filter(v=>v!==null);return sl.length>2?std(sl):null;});}
function zScore(arr,w=60){const rm=rollMean(arr,w),rs=rollStd(arr,w);return arr.map((v,i)=>(v!==null&&rs[i]>0)?(v-rm[i])/rs[i]:null);}
function linReg(xs,ys){const n=xs.length,mx=mean(xs),my=mean(ys);let num=0,den=0;for(let i=0;i<n;i++){num+=(xs[i]-mx)*(ys[i]-my);den+=(xs[i]-mx)**2;}const sl=den?num/den:0,ic=my-sl*mx;const se=Math.sqrt(ys.map((y,i)=>(y-(sl*xs[i]+ic))**2).reduce((s,v)=>s+v,0)/(n-2)||0.01);return{slope:sl,intercept:ic,se};}
function dt(rows){return rows.map(r=>r._dt?r._dt.toISOString().replace('T',' ').slice(0,19):null);}

function scoreParam(val,okLo,okHi,warnHi,hisBad=true){
  if(val===null)return 70;
  if(hisBad){if(val<=okHi)return 100;if(warnHi&&val<=warnHi)return 60;return 20;}
  else{if(val>=okLo)return 100;if(val>=okHi)return 60;return 20;}
}
function calcHealth(rows,cols){
  const get=fn=>{const c=fn(cols);return c?mean(getCol(rows,c)):null;};
  const scores=[
    scoreParam(get(colTCool),82,95,105,true),
    scoreParam(get(colPOil),300,350,null,false),
    scoreParam(get(colTOil),85,105,115,true),
    scoreParam(get(colTexhAvg),380,520,560,true),
    scoreParam(get(colCrank),0,3,7,true),
  ].filter(s=>s!==null);
  return scores.length?Math.round(mean(scores)):null;
}

// ═══════════════════════════════════════════════════
// CSV PARSER
// ═══════════════════════════════════════════════════
function truckNum(fname){
  let m=fname.match(/DML-\d+-\d+\s+(\d+)/);if(m)return+m[1];
  for(const p of[/№(\d+)/,/N(\d+)/,/_(\d+)[_. ]/,/\((\d+)\)/,/\s(\d{2,3})[ .(]/]){m=fname.match(p);if(m)return+m[1];}
  return Math.floor(Math.random()*900)+10;
}

function parseCSV(file){
  return new Promise((ok,fail)=>{
    const r=new FileReader();
    r.onerror=fail;
    r.onload=e=>{
      const text=e.target.result;
      const lines=text.split(/\r?\n/);
      let hdr=-1;
      for(let i=0;i<Math.min(lines.length,80);i++){
        const l=lines[i].trim();
        if(l.startsWith('"Дата"')||l.startsWith('Дата,')||l.startsWith('"Date"')||l.startsWith('Date,')){hdr=i;break;}
      }
      if(hdr<0){ok(null);return;}
      const dataStr=lines.slice(hdr).filter(l=>l.trim()).join('\n');
      Papa.parse(dataStr,{
        header:true,dynamicTyping:false,skipEmptyLines:true,
        complete:res=>{
          if(!res.data||res.data.length<5){ok(null);return;}
          const cols=Object.keys(res.data[0]);
          const truck=truckNum(file.name);
          const model=file.name.includes('NTE')||file.name.includes('DML')?'NTE200':'730E';
          const rows=res.data.map(row=>{
            const out={};
            for(const k in row){
              const v=row[k];
              if(typeof v==='string'){const n=parseFloat(v.replace(',','.'));out[k]=isNaN(n)?v:n;}
              else out[k]=v;
            }
            // datetime
            const dc=out['Дата']!==undefined?'Дата':'Date';
            const tc=out['Время']!==undefined?'Время':'Time';
            if(out[dc]!=null&&out[tc]!=null){
              const ds=String(out[dc]).replace(/(\d{2})\.(\d{2})\.(\d{4})/,'$3-$2-$1');
              const ts=String(out[tc]).substring(0,8);
              const d=new Date(ds+'T'+ts);
              out._dt=isNaN(d)?null:d;
            }
            return out;
          }).filter(r=>r._dt);
          ok({rows,cols,truck,model,file:file.name});
        },error:fail
      });
    };
    r.readAsText(file,'windows-1251');
  });
}

// ═══════════════════════════════════════════════════
// FILE LOADING UI
// ═══════════════════════════════════════════════════
function dzOver(e){e.preventDefault();document.getElementById('dz').classList.add('drag');}
function dzLeave(){document.getElementById('dz').classList.remove('drag');}
function dzDrop(e){e.preventDefault();dzLeave();onFiles(e.dataTransfer.files);}

async function onFiles(files){
  if(!files||!files.length)return;
  setStatus('Загрузка…',false);
  const arr=Array.from(files);
  let loaded=0;
  for(const f of arr){
    try{
      const d=await parseCSV(f);
      if(!d){continue;}
      const key=d.model+'_'+d.truck;
      if(!DB[key]){DB[key]=d;truckOrder.push(key);}
      else{DB[key].rows.push(...d.rows);}
      loaded++;
    }catch(ex){console.warn(f.name,ex);}
  }
  if(loaded){
    const dz=document.getElementById('dz');
    dz.classList.remove('drag');dz.classList.add('has-files');
    document.getElementById('dz-count').textContent=Object.keys(DB).length+' файл(ов)';
    setStatus(`Загружено: ${loaded}/${arr.length}`,true);
    rebuildPills();
    updateKPIs();
    renderAll();
  }else setStatus('Ошибка формата',false,true);
}
function setStatus(msg,ok,err){
  const el=document.getElementById('status');
  el.textContent=msg;
  el.className='status'+(ok?' ok':err?' err':'');
}

// ═══════════════════════════════════════════════════
// TRUCK PILLS
// ═══════════════════════════════════════════════════
function rebuildPills(){
  const row=document.getElementById('truck-row');
  // Remove only existing pill elements, keep static elements (#no-trucks, #cmp-btn, .tr-label)
  row.querySelectorAll('.truck-pill').forEach(p=>p.remove());
  const keys=truckOrder.filter(k=>DB[k]);
  const noTrucks=document.getElementById('no-trucks');
  if(noTrucks) noTrucks.style.display=keys.length?'none':'';
  const cmpBtn=document.getElementById('cmp-btn');
  keys.forEach((k,i)=>{
    const d=DB[k];
    const pill=document.createElement('div');
    pill.className='truck-pill'+(activeTruck===null&&i===0||activeTruck===k?' active':'');
    pill.dataset.key=k;
    const dot=document.createElement('span');dot.className='dot';dot.style.background=TRUCK_COLORS[i%TRUCK_COLORS.length];
    const lbl2=document.createElement('span');lbl2.textContent=d.model+' №'+d.truck;
    pill.appendChild(dot);pill.appendChild(lbl2);
    pill.onclick=()=>{selectTruck(k);};
    // Insert before cmpBtn to keep button at the end
    row.insertBefore(pill, cmpBtn);
  });
  if(activeTruck===null&&keys.length)activeTruck=keys[0];
  if(cmpBtn) cmpBtn.style.display=keys.length>1?'':'none';
}

function selectTruck(key){
  activeTruck=key;compareMode=false;
  document.querySelectorAll('.truck-pill').forEach(p=>p.classList.toggle('active',p.dataset.key===key));
  document.getElementById('cmp-btn').classList.remove('act');
  renderAll();
}

function toggleCompare(){
  compareMode=!compareMode;
  const btn=document.getElementById('cmp-btn');
  btn.classList.toggle('act',compareMode);
  if(compareMode){
    document.querySelectorAll('.truck-pill').forEach(p=>p.classList.remove('active'));
  }else{
    if(activeTruck)document.querySelector(`.truck-pill[data-key="${activeTruck}"]`)?.classList.add('active');
  }
  renderAll();
}

function activeData(){
  if(compareMode)return Object.entries(DB).map(([k,d])=>({key:k,...d,color:TRUCK_COLORS[truckOrder.indexOf(k)%TRUCK_COLORS.length]}));
  if(activeTruck&&DB[activeTruck])return[{key:activeTruck,...DB[activeTruck],color:TRUCK_COLORS[0]}];
  return[];
}
function firstData(){const a=activeData();return a.length?a[0]:null;}

// ═══════════════════════════════════════════════════
// KPIs
// ═══════════════════════════════════════════════════
function updateKPIs(){
  const keys=truckOrder.filter(k=>DB[k]);
  document.getElementById('kpi-trucks').textContent=keys.length;
  const total=keys.reduce((s,k)=>s+DB[k].rows.length,0);
  document.getElementById('kpi-rows').textContent=total>999?Math.round(total/1000)+'K':total;
  // period
  let minDt=null,maxDt=null;
  for(const k of keys){
    for(const r of DB[k].rows){
      if(r._dt){if(!minDt||r._dt<minDt)minDt=r._dt;if(!maxDt||r._dt>maxDt)maxDt=r._dt;}
    }
  }
  if(minDt&&maxDt){
    const d=Math.round((maxDt-minDt)/864e5);
    document.getElementById('kpi-dur').textContent=minDt.toISOString().slice(0,10)+(d>0?' +'+d+'д':'');
  }
  // health
  const scores=keys.map(k=>calcHealth(DB[k].rows,DB[k].cols)).filter(s=>s!==null);
  if(scores.length){
    const avg=Math.round(mean(scores));
    const el=document.getElementById('kpi-health');
    el.textContent=avg+'%';
    el.style.color=avg>=70?C.grn:avg>=40?C.amb:C.red;
  }
}

function renderAll(){
  const tab=document.querySelector('.panel.show')?.id?.replace('tab-','');
  if(tab)renderTab(tab);
}

function showTab(name,btn){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('show'));
  document.querySelectorAll('.tbtn').forEach(b=>b.classList.remove('act'));
  document.getElementById('tab-'+name).classList.add('show');
  btn.classList.add('act');
  renderTab(name);
}
function renderTab(name){
  if(name==='overview')renderOverview();
  else if(name==='temps')renderTemps();
  else if(name==='cylinders')renderCylinders();
  else if(name==='pressure')renderPressure();
  else if(name==='fuel')renderFuel();
  else if(name==='modes')renderModes();
  else if(name==='predictive')renderPredictive();
}

// ═══════════════════════════════════════════════════
// SHARED: single time-series
// ═══════════════════════════════════════════════════
function tsChart(divId,colFn,opts={}){
  const ads=activeData();
  if(!ads.length){empty(divId,opts.title||'Нет данных');return;}
  const traces=[];
  for(const d of ads){
    const col=colFn(d.cols);if(!col)continue;
    const rows=d.rows;
    const dts=dt(rows);
    const raw=getCol(rows,col);
    const ew=ewma(raw);
    const label=d.model+' №'+d.truck;
    traces.push({type:'scattergl',x:dts,y:raw,name:label+' raw',line:{color:d.color,width:1},opacity:0.45,showlegend:ads.length>1});
    traces.push({type:'scattergl',x:dts,y:ew,name:label,line:{color:d.color,width:2},showlegend:true});
  }
  if(!traces.length){empty(divId,'Нет колонки: '+opts.title);return;}
  const shapes=[];const annotations=[];
  for(const h of(opts.hlines||[])){
    shapes.push({type:'line',x0:0,x1:1,xref:'paper',y0:h.v,y1:h.v,line:{color:h.c,dash:'dot',width:1.5}});
    annotations.push({x:0.02,xref:'paper',y:h.v,text:h.l,showarrow:false,font:{color:h.c,size:9},xanchor:'left'});
  }
  for(const z of(opts.zones||[])){
    shapes.push({type:'rect',x0:0,x1:1,xref:'paper',y0:z.lo,y1:z.hi,fillcolor:z.c,line:{width:0},layer:'below'});
  }
  pl(divId,traces,{title:{text:opts.title,font:{size:12}},height:opts.h||260,
    yaxis:{title:opts.unit},shapes,annotations});
}

function renderOverview(){
  const keys=truckOrder.filter(k=>DB[k]);
  if(!keys.length){
    ['ch-health-g','ch-kpi-table','ch-overview-params','ch-overview-cyl','ch-fleet-compare'].forEach(id=>empty(id,'Загрузите CSV'));
    return;
  }

  // Health gauge (avg or selected)
  const ad=firstData();
  const score=ad?calcHealth(ad.rows,ad.cols):null;
  if(score!==null){
    const sc=score,col=sc>=70?C.grn:sc>=40?C.amb:C.red;
    pl('ch-health-g',[{type:'indicator',mode:'gauge+number',value:sc,
      title:{text:'Health ДВС'+(ad?' — '+ad.model+' №'+ad.truck:''),font:{size:11}},
      number:{font:{color:col,size:34},suffix:'%'},
      gauge:{axis:{range:[0,100],tickcolor:C.tx3},bar:{color:col},
        steps:[{range:[0,40],color:'rgba(255,77,106,0.25)'},{range:[40,70],color:'rgba(255,197,66,0.18)'},{range:[70,100],color:'rgba(61,220,132,0.15)'}],
        threshold:{line:{color:'white',width:2.5},value:70}}}],
      {height:220,margin:{l:25,r:25,t:40,b:10}});
  }else empty('ch-health-g','Нет данных');

  // KPI table
  const params=[
    {lbl:'RPM',fn:colRPM,ok:[1600,1900],warn:[1200,2100]},
    {lbl:'T охл. °C',fn:colTCool,ok:[82,95],warn:[95,105]},
    {lbl:'T масла °C',fn:colTOil,ok:[85,105],warn:[105,115]},
    {lbl:'P масла кПа',fn:colPOil,ok:[350,700],warn:[300,350]},
    {lbl:'T выхл. °C',fn:colTexhAvg,ok:[380,520],warn:[520,560]},
    {lbl:'P картера кПа',fn:colCrank,ok:[0,3],warn:[3,7]},
    {lbl:'P наддув кПа',fn:colBoost,ok:[200,350],warn:[150,200]},
    {lbl:'Топливо л/ч',fn:colFuel,ok:[0,150],warn:[150,180]},
    {lbl:'Нагрузка %',fn:colLoad,ok:[0,100],warn:[100,120]},
  ];
  const thead=['Параметр',...keys.map(k=>DB[k].model+' №'+DB[k].truck)];
  const tbody=[];
  const cellColors=[thead.map(()=>C.card)];
  for(const p of params){
    const row=[p.lbl];
    const rowColors=[C.bg2];
    for(const k of keys){
      const d=DB[k];const col=p.fn(d.cols);
      if(!col){row.push('–');rowColors.push(C.bg2);continue;}
      const v=mean(getCol(d.rows,col));
      if(v===null){row.push('–');rowColors.push(C.bg2);continue;}
      row.push(v.toFixed(1));
      const [okLo,okHi]=p.ok,[wLo,wHi]=p.warn;
      let rc=C.bg2;
      if(p.lbl.includes('масла кПа')||p.lbl.includes('наддув')){
        rc=v<wLo?C.red:v<okLo?C.amb:C.bg2;
      }else{
        rc=v>wHi?C.red:v>okHi?C.amb:C.bg2;
      }
      rowColors.push(rc);
    }
    tbody.push(row);cellColors.push(rowColors);
  }
  pl('ch-kpi-table',[{type:'table',
    header:{values:thead,fill:{color:C.bg2},font:{color:C.acc,size:11},align:'left'},
    cells:{values:thead.map((_,ci)=>tbody.map(r=>r[ci])),
      fill:{color:thead.map((_,ci)=>tbody.map((_,ri)=>cellColors[ci+1]?cellColors[ci+1][ri]:C.bg2))},
      font:{color:C.tx,size:11},align:'left'},
  }],{title:'Средние значения параметров',height:310});

  // Mini overview charts
  if(ad){
    const col=colTexhAvg(ad.cols);
    const dts=dt(ad.rows);
    if(col){
      const v=getCol(ad.rows,col);
      pl('ch-overview-params',[
        {type:'scattergl',x:dts,y:v,name:'T выхл.',line:{color:C.red,width:1},opacity:0.5},
        {type:'scattergl',x:dts,y:ewma(v,0.05),name:'EWMA',line:{color:C.amb,width:2}},
      ],{title:'T выхлопа (обзор)',height:210,yaxis:{title:'°C'}});
    }else empty('ch-overview-params','Нет T выхлопа');

    const cyls=colsCyls(ad.cols);
    if(cyls.length){
      const avgs=cyls.map(({n,col})=>({n,v:mean(getCol(ad.rows,col))||0}));
      const gm=mean(avgs.map(a=>a.v));
      pl('ch-overview-cyl',[{
        type:'bar',x:avgs.map(a=>'Ц'+a.n),y:avgs.map(a=>+(a.v-gm).toFixed(1)),
        marker:{color:avgs.map(a=>Math.abs(a.v-gm)>60?C.red:Math.abs(a.v-gm)>30?C.amb:C.grn)},
        text:avgs.map(a=>(a.v-gm>0?'+':'')+((a.v-gm).toFixed(0))),textposition:'auto',
      }],{title:'Баланс цилиндров ∆°C',height:210,
        shapes:[{type:'line',x0:-0.5,x1:15.5,y0:30,y1:30,line:{color:C.amb,dash:'dot',width:1}},{type:'line',x0:-0.5,x1:15.5,y0:-30,y1:-30,line:{color:C.amb,dash:'dot',width:1}},{type:'line',x0:-0.5,x1:15.5,y0:60,y1:60,line:{color:C.red,dash:'dot',width:1}},{type:'line',x0:-0.5,x1:15.5,y0:-60,y1:-60,line:{color:C.red,dash:'dot',width:1}}]});
    }else empty('ch-overview-cyl','Нет данных цилиндров');
  }else{empty('ch-overview-params','Нет данных');empty('ch-overview-cyl','Нет данных');}

  // Fleet comparison bar
  const cmpParams=[
    {lbl:'Health %',vals:keys.map(k=>calcHealth(DB[k].rows,DB[k].cols)),color:C.grn},
  ];
  const cmpBar=[];
  for(const [i,k] of keys.entries()){
    const d=DB[k];
    const sc=calcHealth(d.rows,d.cols)||0;
    cmpBar.push({
      type:'bar',name:d.model+' №'+d.truck,
      x:['Health','T охл.','P масла','T выхл.','P картера'].map((p,pi)=>[p,
        [colTCool,colPOil,colTexhAvg,colCrank][pi]?mean(getCol(d.rows,[colTCool,colPOil,colTexhAvg,colCrank][pi](d.cols)))||0:0
      ]),
      y:[sc,
        mean(getCol(d.rows,colTCool(d.cols)))||0,
        mean(getCol(d.rows,colPOil(d.cols)))||0,
        mean(getCol(d.rows,colTexhAvg(d.cols)))||0,
        mean(getCol(d.rows,colCrank(d.cols)))||0,
      ],
      marker:{color:TRUCK_COLORS[i%TRUCK_COLORS.length]},
    });
  }
  // Grouped bar: one series per truck, params on x
  const paramNames=['Health %','T охл. °C','P масла кПа','T выхл. °C','P картера кПа'];
  const fleetTraces=keys.map((k,i)=>{
    const d=DB[k];
    const fns=[null,colTCool,colPOil,colTexhAvg,colCrank];
    const yy=[calcHealth(d.rows,d.cols)||0,...fns.slice(1).map(fn=>{const c=fn(d.cols);return c?+(mean(getCol(d.rows,c))||0).toFixed(1):0;})];
    return{type:'bar',name:d.model+' №'+d.truck,x:paramNames,y:yy,marker:{color:TRUCK_COLORS[i%TRUCK_COLORS.length]}};
  });
  pl('ch-fleet-compare',fleetTraces,{title:'Сравнение самосвалов',height:250,barmode:'group'});
}

// TAB: CYLINDERS
// ═══════════════════════════════════════════════════
function renderCylinders(){
  const ad=firstData();
  if(!ad){['ch-cyl-heatmap','ch-cyl-balance','ch-cyl-box','ch-cyl-trend'].forEach(id=>empty(id,'Нет данных'));return;}
  const cyls=colsCyls(ad.cols);
  if(!cyls.length){['ch-cyl-heatmap','ch-cyl-balance','ch-cyl-box','ch-cyl-trend'].forEach(id=>empty(id,'Нет колонок цилиндров'));return;}

  const dts=dt(ad.rows);
  const sample=Math.min(ad.rows.length,600);
  const step=Math.max(1,Math.floor(ad.rows.length/sample));
  const idxs=Array.from({length:sample},(_,i)=>i*step).filter(i=>i<ad.rows.length);
  const dtSample=idxs.map(i=>dts[i]);

  // Heatmap
  const z=cyls.map(({col})=>idxs.map(i=>getCol([ad.rows[i]],col)[0]||0));
  pl('ch-cyl-heatmap',[{type:'heatmap',z,x:dtSample,y:cyls.map(({n})=>'Ц'+n),
    colorscale:[[0,'#1a2535'],[0.3,C.blu],[0.6,C.amb],[1,C.red]],
    colorbar:{title:{text:'°C'},tickfont:{color:C.tx3}},
    hovertemplate:'Цилиндр %{y}<br>%{x}<br>%{z}°C<extra></extra>',
  }],{title:'Тепловая карта температур цилиндров',height:420,
    xaxis:{title:'',showticklabels:false},yaxis:{title:'',autorange:'reversed'}});

  // Balance bar
  const avgs=cyls.map(({n,col})=>({n,v:mean(getCol(ad.rows,col))||0}));
  const gm=mean(avgs.map(a=>a.v));
  const devs=avgs.map(a=>+((a.v-gm).toFixed(1)));
  const bColors=devs.map(d=>Math.abs(d)>60?C.red:Math.abs(d)>30?C.amb:C.grn);
  pl('ch-cyl-balance',[{
    type:'bar',x:avgs.map(a=>'Ц'+a.n),y:devs,
    marker:{color:bColors,line:{color:'rgba(0,0,0,0.3)',width:0.5}},
    text:devs.map(d=>(d>0?'+':'')+d),textposition:'outside',textfont:{size:9},
  }],{title:'Дисбаланс цилиндров (∆°C от среднего)',height:270,yaxis:{title:'∆°C'},
    shapes:[{type:'rect',x0:-0.5,x1:cyls.length-0.5,y0:-30,y1:30,fillcolor:'rgba(61,220,132,0.07)',line:{width:0}},
      {type:'line',x0:-0.5,x1:cyls.length-0.5,y0:30,y1:30,line:{color:C.amb,dash:'dot',width:1}},{type:'line',x0:-0.5,x1:cyls.length-0.5,y0:-30,y1:-30,line:{color:C.amb,dash:'dot',width:1}},
      {type:'line',x0:-0.5,x1:cyls.length-0.5,y0:60,y1:60,line:{color:C.red,dash:'dot',width:1}},{type:'line',x0:-0.5,x1:cyls.length-0.5,y0:-60,y1:-60,line:{color:C.red,dash:'dot',width:1}}]});

  // Box plot
  pl('ch-cyl-box',cyls.map(({n,col})=>({
    type:'box',y:nn(getCol(ad.rows,col)),name:'Ц'+n,boxpoints:false,
    marker:{color:TRUCK_COLORS[(n-1)%10]},line:{width:1.2},
  })),{title:'Распределение T цилиндров (box)',height:270,yaxis:{title:'°C'},showlegend:false});

  // Trend: left/right bank averages over time
  const leftCyls=cyls.filter(c=>c.n%2===1);  // odd = left bank: 1,3,5,7,9,11,13,15
  const rightCyls=cyls.filter(c=>c.n%2===0); // even = right bank: 2,4,6,8,10,12,14,16
  const ltAvg=dts.map((_,i)=>mean(leftCyls.map(({col})=>toNum(ad.rows[i][col]))));
  const rtAvg=dts.map((_,i)=>mean(rightCyls.map(({col})=>toNum(ad.rows[i][col]))));
  pl('ch-cyl-trend',[
    {type:'scattergl',x:dts,y:ewma(ltAvg,0.05),name:'Лев. банк (нечётные)',line:{color:C.blu,width:2}},
    {type:'scattergl',x:dts,y:ewma(rtAvg,0.05),name:'Прав. банк (чётные)',line:{color:C.red,width:2,dash:'dot'}},
  ],{title:'Средняя T выхлопа: левый vs правый банк',height:250,yaxis:{title:'°C'},
    shapes:[{type:'line',x0:0,x1:1,xref:'paper',y0:520,y1:520,line:{color:C.amb,dash:'dot',width:1}},{type:'line',x0:0,x1:1,xref:'paper',y0:560,y1:560,line:{color:C.red,dash:'dot',width:1}}]});
}

// TAB: PRESSURE
// ═══════════════════════════════════════════════════
function renderPressure(){
  tsChart('ch-poil',colPOil,{title:'Давление масла кПа',unit:'кПа',h:260,
    zones:[{lo:350,hi:700,c:'rgba(61,220,132,0.08)'},{lo:300,hi:350,c:'rgba(255,197,66,0.08)'},{lo:0,hi:300,c:'rgba(255,77,106,0.06)'}],
    hlines:[{v:350,l:'Норм. 350 кПа',c:C.grn},{v:300,l:'⚠ 300 кПа',c:C.amb}]});

  tsChart('ch-crank',colCrank,{title:'Давление картерных газов кПа',unit:'кПа',h:260,
    zones:[{lo:0,hi:3,c:'rgba(61,220,132,0.08)'},{lo:3,hi:7,c:'rgba(255,197,66,0.08)'},{lo:7,hi:20,c:'rgba(255,77,106,0.06)'}],
    hlines:[{v:3,l:'⚠ 3 кПа',c:C.amb},{v:7,l:'🔴 7 кПа',c:C.red}]});

  tsChart('ch-boost',colBoost,{title:'Давление наддува (впускной коллектор) кПа',unit:'кПа',h:260,
    hlines:[{v:180,l:'Мин. 180 кПа',c:C.red},{v:220,l:'⚠ 220 кПа',c:C.amb}]});

  // Oil filter delta
  const ads=activeData();
  if(ads.length){
    const traces=[];
    for(const d of ads){
      const c=colOilFilterDelta(d.cols);
      if(!c)continue;
      const dts=dt(d.rows);const v=getCol(d.rows,c);
      traces.push({type:'scattergl',x:dts,y:v,name:d.model+' №'+d.truck,line:{color:d.color,width:1.5}});
    }
    if(traces.length)pl('ch-poil-filter',traces,{title:'Перепад давления масляного фильтра кПа',height:260,yaxis:{title:'кПа'},shapes:[{type:'line',x0:0,x1:1,xref:'paper',y0:100,y1:100,line:{color:C.amb,dash:'dot',width:1.5}}]});
    else empty('ch-poil-filter','Нет данных фильтра');
  }else empty('ch-poil-filter','Нет данных');

  // Fuel rail: commanded vs measured
  if(ads.length){
    const traces=[];
    for(const d of ads){
      const cc=colFRailCmd(d.cols),mc=colFRailMeas(d.cols);
      const dts=dt(d.rows);const lbl=d.model+' №'+d.truck;
      if(cc)traces.push({type:'scattergl',x:dts,y:ewma(getCol(d.rows,cc),0.1),name:lbl+' Задан.',line:{color:d.color,width:2}});
      if(mc)traces.push({type:'scattergl',x:dts,y:ewma(getCol(d.rows,mc),0.1),name:lbl+' Измер.',line:{color:d.color,width:1.5,dash:'dot'}});
    }
    if(traces.length)pl('ch-frail',traces,{title:'Давление топливной рейки: заданное vs измеренное (Бар)',height:260,yaxis:{title:'Бар'}});
    else empty('ch-frail','Нет данных топливной рейки');
  }else empty('ch-frail','Нет данных');
}

// ═══════════════════════════════════════════════════
// TAB: FUEL
// ═══════════════════════════════════════════════════
function renderFuel(){
  // Fuel rate + rolling mean
  const ads=activeData();
  if(!ads.length){['ch-fuel-rate','ch-fuel-pump','ch-fuel-vs-load'].forEach(id=>empty(id,'Нет данных'));return;}
  {
    const traces=[];
    for(const d of ads){
      const c=colFuel(d.cols);if(!c)continue;
      const dts=dt(d.rows);const v=getCol(d.rows,c);const lbl=d.model+' №'+d.truck;
      traces.push({type:'scattergl',x:dts,y:v,name:lbl+' мгн.',line:{color:d.color,width:1},opacity:0.4});
      traces.push({type:'scattergl',x:dts,y:rollMean(v,30),name:lbl+' ср.30с',line:{color:d.color,width:2}});
    }
    if(traces.length)pl('ch-fuel-rate',traces,{title:'Расход топлива л/ч',height:270,yaxis:{title:'л/ч'}});
    else empty('ch-fuel-rate','Нет данных');
  }
  // Pump duty cycle + commanded current
  {
    const traces=[];
    for(const d of ads){
      const dc=colFuelPumpDuty(d.cols),ic=colFuelPumpCurrent(d.cols);
      const dts=dt(d.rows);const lbl=d.model+' №'+d.truck;
      if(dc)traces.push({type:'scattergl',x:dts,y:getCol(d.rows,dc),name:lbl+' Раб.цикл %',line:{color:d.color,width:1.5},yaxis:'y'});
      if(ic)traces.push({type:'scattergl',x:dts,y:getCol(d.rows,ic),name:lbl+' Ток мА',line:{color:d.color,width:1.5,dash:'dot'},yaxis:'y2'});
    }
    if(traces.length)pl('ch-fuel-pump',traces,{title:'Насос топлива: раб. цикл (%) и ток (мА)',height:270,yaxis:{title:'%'},yaxis2:{title:'мА',overlaying:'y',side:'right'}});
    else empty('ch-fuel-pump','Нет данных насоса');
  }
  // Fuel vs load scatter
  {
    const traces=[];
    for(const d of ads){
      const fc=colFuel(d.cols),lc=colLoad(d.cols);if(!fc||!lc)continue;
      const fv=getCol(d.rows,fc),lv=getCol(d.rows,lc);
      const xs=[],ys=[];
      for(let i=0;i<fv.length;i++){if(fv[i]!==null&&lv[i]!==null){xs.push(lv[i]);ys.push(fv[i]);}}
      if(xs.length)traces.push({type:'scattergl',x:xs,y:ys,mode:'markers',name:d.model+' №'+d.truck,marker:{color:d.color,size:3,opacity:0.4}});
    }
    if(traces.length)pl('ch-fuel-vs-load',traces,{title:'Расход топлива vs нагрузка (%)',height:260,xaxis:{title:'Нагрузка %'},yaxis:{title:'Расход л/ч'}});
    else empty('ch-fuel-vs-load','Нет данных');
  }
}

// ═══════════════════════════════════════════════════
// TAB: PREDICTIVE
// ═══════════════════════════════════════════════════
function renderPredictive(){
  const ad=firstData();
  if(!ad){['ch-pred-health','ch-risk','ch-anomaly-tcool','ch-anomaly-poil','ch-forecast-poil','ch-ewma-crank','ch-cyl-risk'].forEach(id=>empty(id,'Нет данных'));return;}
  const {rows,cols}=ad;
  const lbl=ad.model+' №'+ad.truck;

  // Health gauge
  const score=calcHealth(rows,cols)||0;
  const sc=score,hc=sc>=70?C.grn:sc>=40?C.amb:C.red;
  pl('ch-pred-health',[{type:'indicator',mode:'gauge+number+delta',value:sc,
    delta:{reference:70,increasing:{color:C.grn},decreasing:{color:C.red}},
    title:{text:'Индекс здоровья ДВС — '+lbl,font:{size:11}},
    number:{font:{color:hc,size:36},suffix:'%'},
    gauge:{axis:{range:[0,100],tickcolor:C.tx3},bar:{color:hc},
      steps:[{range:[0,40],color:'rgba(255,77,106,0.2)'},{range:[40,70],color:'rgba(255,197,66,0.15)'},{range:[70,100],color:'rgba(61,220,132,0.12)'}],
      threshold:{line:{color:'white',width:2.5},value:70}}}],
    {height:260,margin:{l:25,r:25,t:45,b:10}});

  // Risk table
  const checks=[
    {lbl:'T охл. °C',fn:colTCool,okLo:82,okHi:95,wHi:105,bad:true},
    {lbl:'P масла кПа',fn:colPOil,okLo:300,okHi:350,wHi:null,bad:false},
    {lbl:'T масла °C',fn:colTOil,okLo:85,okHi:105,wHi:115,bad:true},
    {lbl:'T выхл. °C',fn:colTexhAvg,okLo:380,okHi:520,wHi:560,bad:true},
    {lbl:'P картера кПа',fn:colCrank,okLo:0,okHi:3,wHi:7,bad:true},
    {lbl:'P наддув кПа',fn:colBoost,okLo:180,okHi:220,wHi:null,bad:false},
    {lbl:'Расход л/ч',fn:colFuel,okLo:0,okHi:150,wHi:180,bad:true},
  ];
  const rLabels=[],rVals=[],rTrends=[],rRisks=[],rColors=[];
  for(const c of checks){
    const col=c.fn(cols);if(!col)continue;
    const vals=getCol(rows,col);const cur=mean(vals.slice(-60));const prev=mean(vals.slice(-300,-240));
    if(cur===null)continue;
    const arrow=cur>((prev||cur)*1.02)?'↑':cur<((prev||cur)*0.98)?'↓':'→';
    let risk='Н',rc=C.grn;
    if(c.bad){if(c.wHi&&cur>c.wHi){risk='В';rc=C.red;}else if(cur>c.okHi){risk='С';rc=C.amb;}}
    else{if(cur<c.okLo){risk='В';rc=C.red;}else if(cur<c.okHi){risk='С';rc=C.amb;}}
    rLabels.push(c.lbl);rVals.push(cur.toFixed(1));rTrends.push(arrow);rRisks.push(risk);rColors.push(rc);
  }
  pl('ch-risk',[{type:'table',
    header:{values:['Параметр','Текущее','Тренд','Риск'],fill:{color:C.bg2},font:{color:C.acc,size:11},align:'center'},
    cells:{values:[rLabels,rVals,rTrends,rRisks],
      fill:{color:[rLabels.map(()=>C.bg2),rLabels.map(()=>C.bg2),rLabels.map(()=>C.bg2),rColors]},
      font:{color:C.tx,size:11},align:'center'},
  }],{title:'Таблица рисков — '+lbl,height:260});

  // Anomaly detection function
  function anomalyChart(divId,colFn,paramName){
    const col=colFn(cols);if(!col){empty(divId,'Нет '+paramName);return;}
    const dts=dt(rows);const v=getCol(rows,col);const z=zScore(v,60);
    const nx=[],ny=[],ax=[],ay=[];
    dts.forEach((t,i)=>{if(z[i]!==null&&Math.abs(z[i])>3){ax.push(t);ay.push(v[i]);}else{nx.push(t);ny.push(v[i]);}});
    pl(divId,[
      {type:'scattergl',x:nx,y:ny,mode:'markers',name:'Норма',marker:{color:C.grn,size:2,opacity:0.4}},
      {type:'scattergl',x:ax,y:ay,mode:'markers',name:ax.length+' аномалий',marker:{color:C.red,size:7,symbol:'x'}},
    ],{title:'Аномалии '+paramName+' — '+lbl,height:250,yaxis:{title:''}});
  }
  anomalyChart('ch-anomaly-tcool',colTCool,'T охл.');
  anomalyChart('ch-anomaly-poil',colPOil,'P масла');

  // Forecast: oil pressure
  function forecastChart(divId,colFn,paramName,critLine){
    const col=colFn(cols);if(!col){empty(divId,'Нет '+paramName);return;}
    const dts=dt(rows);const v=getCol(rows,col);
    const step=Math.max(1,Math.floor(v.length/300));
    const xs=[],ys=[],xDts=[];
    for(let i=0;i<v.length;i+=step){if(v[i]!==null){xs.push(i);ys.push(v[i]);xDts.push(dts[i]);}}
    if(xs.length<10){empty(divId,'Мало данных');return;}
    const{slope,intercept,se}=linReg(xs,ys);
    const fN=40,lastX=xs[xs.length-1];
    const fXs=Array.from({length:fN},(_,i)=>lastX+(i+1)*step*2);
    const fY=fXs.map(x=>slope*x+intercept);
    const mx=mean(xs);const xSS=xs.map(x=>(x-mx)**2).reduce((s,v)=>s+v,0)||1;
    const ci=fXs.map(x=>1.96*se*Math.sqrt(1+1/xs.length+(x-mx)**2/xSS));
    const lastDt=new Date(xDts[xDts.length-1]);
    const fDts=fXs.map((_,i)=>new Date(lastDt.getTime()+(i+1)*60e3*step).toISOString().replace('T',' ').slice(0,19));
    pl(divId,[
      {type:'scattergl',x:xDts,y:ys,name:paramName,line:{color:C.blu,width:2}},
      {type:'scattergl',x:fDts,y:fY,name:'Прогноз',line:{color:C.acc,width:2,dash:'dot'}},
      {type:'scatter',x:[...fDts,...fDts.slice().reverse()],y:[...fY.map((v,i)=>v+ci[i]),...fY.map((v,i)=>v-ci[i]).reverse()],fill:'toself',fillcolor:'rgba(0,212,170,0.1)',line:{color:'rgba(0,0,0,0)'},name:'95% ДИ'},
    ],{title:'Прогноз '+paramName+' — '+lbl,height:260,yaxis:{title:''},
      shapes:critLine?[{type:'line',x0:0,x1:1,xref:'paper',y0:critLine,y1:critLine,line:{color:C.red,dash:'dash',width:1.5}}]:[]});
  }
  forecastChart('ch-forecast-poil',colPOil,'P масла кПа',300);

  // EWMA crankcase trend
  {
    const col=colCrank(cols);
    if(col){
      const dts=dt(rows);const v=getCol(rows,col);const ew=ewma(v,0.03);
      pl('ch-ewma-crank',[
        {type:'scattergl',x:dts,y:v,name:'Картер сырой',line:{color:C.red,width:1},opacity:0.35},
        {type:'scattergl',x:dts,y:ew,name:'EWMA α=0.03',line:{color:C.amb,width:2.5}},
      ],{title:'EWMA тренд P картера кПа — '+lbl,height:260,yaxis:{title:'кПа'},
        shapes:[{type:'rect',x0:0,x1:1,xref:'paper',y0:0,y1:3,fillcolor:'rgba(61,220,132,0.07)',line:{width:0}},{type:'line',x0:0,x1:1,xref:'paper',y0:3,y1:3,line:{color:C.amb,dash:'dot',width:1.5}},{type:'line',x0:0,x1:1,xref:'paper',y0:7,y1:7,line:{color:C.red,dash:'dot',width:1.5}}]});
    }else empty('ch-ewma-crank','Нет данных картера');
  }

  // Cylinder risk table
  const cyls=colsCyls(cols);
  if(cyls.length){
    const gm=mean(cyls.map(({col})=>mean(getCol(rows,col))));
    const cLabels=[],cAvgs=[],cDevs=[],cRisks=[],cRColors=[];
    for(const {n,col} of cyls){
      const v=nn(getCol(rows,col));if(!v.length)continue;
      const avg=mean(v),dev=avg-(gm||avg);
      const p95=pct(v,95),p5=pct(v,5),range=p95-p5;
      const risk=Math.abs(dev)>60?'В':Math.abs(dev)>30?'С':'Н';
      const rc=risk==='В'?C.red:risk==='С'?C.amb:C.grn;
      cLabels.push('Цил.'+n);cAvgs.push(avg.toFixed(0));
      cDevs.push((dev>0?'+':'')+dev.toFixed(0));cRisks.push(risk);cRColors.push(rc);
    }
    pl('ch-cyl-risk',[{type:'table',
      header:{values:['Цилиндр','Ср. T °C','∆ от ср.','Риск'],fill:{color:C.bg2},font:{color:C.acc,size:11},align:'center'},
      cells:{values:[cLabels,cAvgs,cDevs,cRisks],
        fill:{color:[cLabels.map(()=>C.bg2),cLabels.map(()=>C.bg2),cLabels.map(()=>C.bg2),cRColors]},
        font:{color:C.tx,size:11},align:'center'},
    }],{title:'Анализ рисков по цилиндрам — '+lbl,height:360});
  }else empty('ch-cyl-risk','Нет данных по цилиндрам');
}
